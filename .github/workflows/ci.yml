name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Prevent Git's default-branch hint while checkout initializes the workspace.
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      # Use the Node.js 24-compatible checkout action to avoid the runner's
      # Node.js 20 deprecation warning.
      - uses: actions/checkout@v7
      # setup-java v5 is the supported Java 21 setup action requested for CI.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Keep Gradle setup on its Node.js 24-compatible action major as well.
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon test installDist

      - run: bash scripts/smoke-test.sh
      - run: bash scripts/verify-distribution.sh

      - run: bash -n scripts/setup-live-tools.sh scripts/live-console-guide.sh scripts/live-preflight.sh scripts/live-smoke-test.sh scripts/test-live-guards.sh
      - run: bash scripts/test-live-guards.sh
