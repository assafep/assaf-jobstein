name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon test installDist

      - run: bash scripts/smoke-test.sh
      - run: bash scripts/verify-distribution.sh

      - run: bash -n scripts/setup-live-tools.sh scripts/live-preflight.sh scripts/live-smoke-test.sh scripts/test-live-guards.sh
      - run: bash scripts/test-live-guards.sh
